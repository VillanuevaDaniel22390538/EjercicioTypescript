version: '3.8'

services:
  todo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-typescript-app
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=production
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./db:/app/db
    restart: unless-stopped