<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List - CRUD con API</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Todo List Manager</h1>
        
        <!-- Formulario para agregar nueva tarea -->
        <section class="form-section">
            <h2>Agregar Nueva Tarea</h2>
            <form id="todo-form">
                <input type="text" id="task-input" placeholder="Descripción de la tarea" required>
                <button type="submit">Agregar</button>
            </form>
        </section>

        <!-- Lista de tareas -->
        <section class="list-section">
            <h2>Mis Tareas</h2>
            <div class="filters">
                <button id="filter-all" class="active">Todas</button>
                <button id="filter-pending">Pendientes</button>
                <button id="filter-complete">Completadas</button>
            </div>
            <ul id="todo-list"></ul>
        </section>

        <!-- Mensajes de estado -->
        <div id="message" class="message"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
